<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <!-- Link our styles. The browser loads this before showing the page. -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Expense Tracker</h1>

    <!-- ============ ADD-EXPENSE FORM ============ -->
    <!-- A <form> groups the inputs. We give it an id so JS can find it. -->
    <form id="expense-form">
      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Lunch" />
      </div>

      <div class="field">
        <label for="amount">Amount ($)</label>
        <!-- min/step are browser hints; we still validate in JS to be safe. -->
        <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" />
      </div>

      <div class="field">
        <label for="category">Category</label>
        <!-- A <select> is a dropdown. Each <option> is a choice. -->
        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="date">Date</label>
        <!-- type="date" gives a date picker. JS will default it to today. -->
        <input type="date" id="date" />
      </div>

      <!-- type="submit" means clicking it submits the form (fires "submit"). -->
      <button type="submit">Add Expense</button>
    </form>

    <!-- Empty spot for validation errors. JS fills/clears this. -->
    <p id="error" class="error"></p>

    <!-- ============ FILTER + SORT CONTROLS ============ -->
    <section class="controls">
      <div class="field">
        <label for="filter">Filter by category</label>
        <select id="filter">
          <!-- "All" resets the filter. Its value is empty on purpose. -->
          <option value="all">All</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="date-desc">Date (newest first)</option>
          <option value="date-asc">Date (oldest first)</option>
          <option value="amount-desc">Amount (high to low)</option>
          <option value="amount-asc">Amount (low to high)</option>
        </select>
      </div>
    </section>

    <!-- ============ THE LIST ============ -->
    <!-- Empty on purpose. JS draws the rows in here from the array. -->
    <ul id="expense-list" class="expense-list"></ul>

    <!-- ============ TOTALS ============ -->
    <section class="totals">
      <p>Showing <span id="count">0</span> expense(s)</p>
      <p class="overall">
        Total: <span id="total">$0.00</span>
        <!-- Convert button + spot for the converted (EUR) result -->
        <button type="button" id="convert-btn">Convert to EUR</button>
        <span id="converted"></span>
      </p>
      <!-- Empty spot for per-category totals. JS fills this. -->
      <div id="category-totals" class="category-totals"></div>
    </section>
  </main>

  <!-- Load JS LAST, at the bottom, so all the HTML above already exists
       when the script runs and tries to find elements. -->
  <script src="script.js"></script>
</body>
</html>
