<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Expense Tracker</h1>

    <!-- Add-expense form -->
    <form id="expense-form">
      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Lunch" />
      </div>

      <div class="field">
        <label for="amount">Amount ($)</label>
        <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" />
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" />
      </div>

      <button type="submit">Add Expense</button>
    </form>

    <p id="error" class="error"></p>

    <!-- Filter and sort controls -->
    <section class="controls">
      <div class="field">
        <label for="filter">Filter by category</label>
        <select id="filter">
          <option value="all">All</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="date-desc">Date (newest first)</option>
          <option value="date-asc">Date (oldest first)</option>
          <option value="amount-desc">Amount (high to low)</option>
          <option value="amount-asc">Amount (low to high)</option>
        </select>
      </div>
    </section>

    <!-- Rows are rendered here by script.js -->
    <ul id="expense-list" class="expense-list"></ul>

    <!-- Totals -->
    <section class="totals">
      <p>Showing <span id="count">0</span> expense(s)</p>
      <p class="overall">
        Total: <span id="total">$0.00</span>
        <button type="button" id="convert-btn">Convert to EUR</button>
        <span id="converted"></span>
      </p>
      <div id="category-totals" class="category-totals"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
